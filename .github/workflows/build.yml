name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore jellyfin-plugin-AnimeMultiSource.sln

      - name: Build plugin
        run: dotnet build jellyfin-plugin-AnimeMultiSource.sln -c Release --no-restore
