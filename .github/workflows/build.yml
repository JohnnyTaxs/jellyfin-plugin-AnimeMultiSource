name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify version and metadata consistency
        run: bash .github/scripts/validate-metadata.sh

      - name: Restore dependencies
        run: dotnet restore jellyfin-plugin-AnimeMultiSource.sln

      - name: Build plugin
        run: dotnet build jellyfin-plugin-AnimeMultiSource.sln -c Release --no-restore

      - name: Publish package
        run: dotnet publish Jellyfin.Plugin.AnimeMultiSource/Jellyfin.Plugin.AnimeMultiSource.csproj -c Release --no-restore -o publish

      - name: Generate package metadata
        run: bash .github/scripts/create-meta-json.sh

      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          for required in "publish/Jellyfin.Plugin.AnimeMultiSource.dll" "publish/plugin.json" "publish/meta.json"; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Package is missing $required"
              exit 1
            fi
          done

          # Jellyfin supplies these at runtime; bundling them breaks interface discovery.
          forbidden=$(find publish -maxdepth 1 -type f \
            \( -name 'MediaBrowser.*.dll' -o -name 'Emby.*.dll' -o -name 'Jellyfin.*.dll' \) \
            ! -name 'Jellyfin.Plugin.AnimeMultiSource.dll' -print)
          if [[ -n "$forbidden" ]]; then
            echo "::error::Package contains Jellyfin server assemblies:"
            echo "$forbidden"
            exit 1
          fi

          expected=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          actual=$(jq -r .version publish/plugin.json)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Published plugin.json version '$actual' does not match '$expected'"
            exit 1
          fi
          echo "Package OK for version $expected"
