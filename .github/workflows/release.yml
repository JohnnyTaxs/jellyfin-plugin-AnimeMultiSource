name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify tag and metadata consistency
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/validate-metadata.sh

      - name: Restore dependencies
        run: dotnet restore jellyfin-plugin-AnimeMultiSource.sln

      - name: Build plugin
        run: dotnet build jellyfin-plugin-AnimeMultiSource.sln -c Release --no-restore

      - name: Publish package
        run: dotnet publish Jellyfin.Plugin.AnimeMultiSource/Jellyfin.Plugin.AnimeMultiSource.csproj -c Release --no-restore -o publish

      - name: Generate package metadata
        run: bash .github/scripts/create-meta-json.sh

      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          for required in "publish/Jellyfin.Plugin.AnimeMultiSource.dll" "publish/plugin.json" "publish/meta.json"; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Package is missing $required"
              exit 1
            fi
          done

          forbidden=$(find publish -maxdepth 1 -type f \
            \( -name 'MediaBrowser.*.dll' -o -name 'Emby.*.dll' -o -name 'Jellyfin.*.dll' \) \
            ! -name 'Jellyfin.Plugin.AnimeMultiSource.dll' -print)
          if [[ -n "$forbidden" ]]; then
            echo "::error::Package contains Jellyfin server assemblies:"
            echo "$forbidden"
            exit 1
          fi

          expected=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          actual=$(jq -r .version publish/plugin.json)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Published plugin.json version '$actual' does not match '$expected'"
            exit 1
          fi

      - name: Create release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          (cd publish && zip -q -r "../AnimeMultiSource_v${version}.zip" .)
          checksum=$(md5sum "AnimeMultiSource_v${version}.zip" | awk '{print toupper($1)}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "::notice::AnimeMultiSource_v${version}.zip MD5 $checksum"

      - name: Prepare manifest entry
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          checksum="${{ steps.package.outputs.checksum }}"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AnimeMultiSource_v${version}.zip"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          target_abi=$(sed -n 's/^targetAbi: "\(.*\)"/\1/p' build.yaml | head -1)

          if [[ -z "$target_abi" ]]; then
            echo "::error::Could not read targetAbi from build.yaml"
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --arg changelog "$changelog_url" \
            --arg targetAbi "$target_abi" \
            --arg sourceUrl "$source_url" \
            --arg checksum "$checksum" \
            --arg timestamp "$timestamp" \
            '{version: $version, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp}' \
            > manifest-entry.json

          jq -e '
            (.version | type == "string" and length > 0)
            and (.targetAbi | type == "string" and length > 0)
            and (.sourceUrl | type == "string" and startswith("https://"))
            and (.changelog | type == "string" and startswith("https://"))
            and (.checksum | type == "string" and test("^[0-9A-F]{32}$"))
            and (.timestamp | type == "string" and length > 0)
          ' manifest-entry.json >/dev/null

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          asset="AnimeMultiSource_v${version}.zip"

          # A version is immutable: never clobber a published asset or replace its manifest entry.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Bump the plugin version and tag a new commit."
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            BEGIN { target = "## " version }
            index($0, target) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$asset" \
            --title "Anime Multi Source ${version}" \
            --notes-file "$notes_file"

      - name: Prepend release to plugin manifest
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$default_branch"
            git switch -C "$default_branch" "origin/$default_branch"

            jq --slurpfile entry manifest-entry.json \
               '.[0].versions = ([$entry[0]] + (.[0].versions | map(select(.version != $entry[0].version))))' \
               manifest.json > manifest.json.tmp
            mv manifest.json.tmp manifest.json

            REQUIRE_MANIFEST_VERSION=1 TAG_VERSION="$GITHUB_REF_NAME" bash .github/scripts/validate-metadata.sh

            git add manifest.json
            if git diff --cached --quiet; then
              echo "Manifest already up to date."
              pushed=true
              break
            fi

            git commit -m "Update manifest for ${GITHUB_REF_NAME}"
            if git push origin "$default_branch"; then
              echo "Manifest updated on $default_branch."
              pushed=true
              break
            fi

            echo "Manifest push failed (attempt $attempt); retrying from the latest $default_branch."
            sleep 5
          done

          if [[ "$pushed" != true ]]; then
            echo "::error::Could not update manifest.json on $default_branch after 3 attempts."
            exit 1
          fi
